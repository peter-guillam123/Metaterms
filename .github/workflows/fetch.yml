name: Fetch archived terms

# Runs when the fetch code, the page list or the job file changes on a
# working branch, or by hand. Commits what it finds back to the branch.
on:
  push:
    branches-ignore: [main]
    paths:
      - "fetch/**"
      - "terms.csv"
      - ".github/workflows/fetch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore downloaded pages
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Check the Wayback Machine answers
        run: |
          curl -sS -o /dev/null -w "cdx: %{http_code} in %{time_total}s\n" --max-time 60 \
            "https://web.archive.org/cdx/search/cdx?url=facebook.com/legal/commercial_terms&limit=1" || true

      - name: Fetch
        # Stops starting new work after BUDGET_MINUTES; partial results are
        # kept and the next run carries on from them.
        timeout-minutes: 40
        env:
          BUDGET_MINUTES: "25"
        run: |
          mkdir -p raw
          pip install -q -r fetch/requirements.txt
          python fetch/run.py "$(cat fetch/job.txt)"

      - name: Save downloaded pages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "metaterms-bot"
          git config user.email "metaterms-bot@users.noreply.github.com"
          for d in data samples; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Fetch results: $(cat fetch/job.txt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
