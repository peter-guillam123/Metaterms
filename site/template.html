<style>

   map (documents down, months across), then the redline feed. */

  --ink: #141a26;
  --ink-2: #4d576b;
  --rule: #d8dde6;
  --del: #b42318;
  --del-bg: #fdeceb;
  --ins: #1d4ed8;

  --m-major: #15318f;

  --focus: #1d4ed8;

  --f-doc: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-1: 0.8125rem;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1118; --sheet: #151b26; --ink: #e5e9f1; --ink-2: #9ba5b9; --rule: #2a3243;
    --del: #ff8f80; --del-bg: #3b1915; --ins: #93b3ff; --ins-bg: #142650;
    --m-same: #273043; --m-minor: #34508f; --m-moderate: #5f88f2; --m-major: #b4c9ff; --m-bad: #5a2d29;
    --focus: #93b3ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1118; --sheet: #151b26; --ink: #e5e9f1; --ink-2: #9ba5b9; --rule: #2a3243;
  --del: #ff8f80; --del-bg: #3b1915; --ins: #93b3ff; --ins-bg: #142650;
  --m-same: #273043; --m-minor: #34508f; --m-moderate: #5f88f2; --m-major: #b4c9ff; --m-bad: #5a2d29;

/* redline */

/* document view */
.back { display: inline-flex; align-items: center; min-height: 40px; font-size: var(--s-1); font-weight: 600; }

.strip .s-same, .strip .s-first { background: var(--m-same); border-color: var(--m-same); }

/* about */
.prose { max-width: 68ch; padding-block: 32px 48px; display: grid; gap: 14px; }

<template id="about-tpl">
  <article class="prose">
    <h1>About Metaterms</h1>
    <p>Metaterms tracks changes to 32 of Meta's terms, policies and guidelines. For each page it takes one copy a month from the Internet Archive's Wayback Machine, from November 2024 to November 2026, turns each copy into plain text and compares it with the month before. Every difference in the wording is listed on the Changes page, with the old and new text side by side and links to the archived copies.</p>
    <p>It is a test. The question was whether this can be done well enough to be worth building a tool that checks the pages every month and flags anything new.</p>

    <h2>How it works</h2>
    <ul>
      <li>A script asks the Wayback Machine which copies of each page it holds, and picks the one nearest the middle of each month.</li>
      <li>It checks every third month first. Where two checks differ, it fetches the months between to find when the change happened, then fills in the rest.</li>
      <li>It strips out menus, footers and code, and tidies quote marks, dashes and spacing so they don't count as changes.</li>
      <li>A comparison finds the paragraphs that were added, removed or reworded, and the words that changed inside them.</li>
      <li>Claude, an AI model, read each set of changes and wrote the short summary at the top of each card. The redline below each summary is the source; the summary is a guide to it.</li>
      <li>The fetching runs on GitHub Actions, and the code and data are in the <a href="https://github.com/peter-guillam123/Metaterms">Metaterms repository</a>.</li>
    </ul>

    <h2>What it can't tell you</h2>
    <ul>
      <li>The Wayback Machine doesn't copy every page every month. A grey dash on the map means there was no copy that month. A change found after a gap could have happened at any point in the gap.</li>
      <li>A change made and reversed between two copies won't show up.</li>
      <li>The archive's crawlers mostly run from the US, so the copies show what Meta serves there. On some pages, people in the UK and EU see different terms.</li>
      <li>Some copies turned out not to be the document at all, such as a login page or an error. These are marked on the map and left out of the comparison.</li>
      <li>Big rewrites and pages that were reorganised can show as long runs of removed and added text, even where much of the meaning stayed the same.</li>
      <li>The size labels count changed words: minor is under 25, moderate under 250, major 250 or more. A one-word change can matter more than a major one.</li>
    </ul>

    <h2>Diary</h2>
    <ol class="diary" id="diary"></ol>
  </article>

<script>
const DATA = /*DATA*/null;

const DIARY = [
  {
    date: "6 November 2026",
    milestone: true,
    title: "First look",
    text: "A colleague in public policy keeps a spreadsheet of Meta's terms and policies, and we wanted to know how often they really change. I asked Claude to pull two years of monthly copies from the Wayback Machine and compare them. The cloud sandbox it works in couldn't reach the archive, so the fetching runs as a GitHub Action instead, which is roughly how a monthly checker would work anyway. The archive's index server is slow and turns you away if you push it, which cost us the first hour and taught us to ask it fewer, politer questions."
  }
];

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTH_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const day = ts => `${+ts.slice(6, 8)} ${MON[+ts.slice(4, 6) - 1]} ${ts.slice(0, 4)}`;
const monthName = m => `${MONTH_LONG[+m.slice(4, 6) - 1]} ${m.slice(0, 4)}`;
const wb = (ts, url) => `https://web.archive.org/web/${ts}/${url}`;
const SIZE_LABEL = { major: "Major", moderate: "Moderate", minor: "Minor", "date only": "Date only", formatting: "Formatting" };
const sizeClass = s => s === "date only" ? "date" : s;

const docs = DATA.docs;
const docBy = Object.fromEntries(docs.map(d => [d.slug, d]));
const changes = DATA.changes;
const changeBy = Object.fromEntries(changes.map(c => [c.id, c]));
const PRODUCTS = ["All Meta", "Facebook", "Instagram"];

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ---------- map ---------- */
function mapTable(rows) {
  const months = DATA.months;
  let years = [], last = null;
  months.forEach((m, i) => {
    const y = m.slice(0, 4);
    if (y !== last) { years.push({ y, n: 1, i }); last = y; } else years[years.length - 1].n++;
  });
  let h = `<table class="map"><caption class="sr">Changes found each month, by document. Each coloured square links to the change.</caption><thead><tr class="years"><th class="doc" scope="col"><span class="sr">Document</span></th>`;
  h += years.map(y => `<th colspan="${y.n}" scope="colgroup">${y.y}</th>`).join("") + `<th></th></tr><tr><th class="doc"></th>`;
  h += months.map(m => `<th scope="col"><abbr title="${monthName(m)}">${MON[+m.slice(4, 6) - 1][0]}</abbr></th>`).join("");
  h += `<th scope="col" class="n"><abbr title="Number of changes">No.</abbr></th></tr></thead>`;
  const yStart = new Set(years.map(y => y.i));
  for (const p of PRODUCTS) {
    const group = rows.filter(d => d.product === p);
    if (!group.length) continue;
    h += `<tbody><tr class="group"><th colspan="${months.length + 2}" scope="rowgroup">${esc(p)}</th></tr>`;
    for (const d of group) {
      h += `<tr><th class="doc" scope="row"><a href="#doc-${d.slug}">${esc(d.title)}</a></th>`;
      months.forEach((m, i) => {
        const c = d.cells[m] || { s: "none" };
        const cls = `c${yStart.has(i) ? " y0" : ""}`;
        if (c.s === "changed") {
          const ch = changeBy[c.id];
          h += `<td class="${cls}"><a class="m m-${sizeClass(ch.size)}" href="#${c.id}" aria-label="${esc(d.title)}: ${SIZE_LABEL[ch.size].toLowerCase()} change, ${monthName(m)}" title="${monthName(m)}: ${SIZE_LABEL[ch.size].toLowerCase()} change"></a></td>`;
        } else {
          const t = { same: "checked, no change", first: "first copy checked", none: "no archived copy", pending: "not checked yet", bad: c.why || "copy unusable" }[c.s];
          h += `<td class="${cls}"><span class="m m-${c.s}" title="${monthName(m)}: ${t}"></span></td>`;
        }
      });
      h += `<td class="n">${d.changes.length || ""}</td></tr>`;
    }
    h += `</tbody>`;
  }
  return h + `</table>`;
}

const LEGEND = `<ul class="legend" aria-label="Key">
  <li><span class="slot"><span class="m m-major"></span></span>Major change</li>
  <li><span class="slot"><span class="m m-moderate"></span></span>Moderate</li>
  <li><span class="slot"><span class="m m-minor"></span></span>Minor</li>
  <li><span class="slot"><span class="m m-date"></span></span>Only a date changed</li>
  <li><span class="slot"><span class="m m-same"></span></span>Checked, no change</li>
  <li><span class="slot"><span class="m m-none"></span></span>No archived copy</li>
  <li><span class="slot"><span class="m m-bad"></span></span>Copy unusable</li>
</ul>`;

/* ---------- redline ---------- */
function blockHTML(text, segs, cls) {
  let kind = "", t = text;
  if (/^#+ /.test(t)) kind = " h";
  else if (/^- /.test(t)) kind = " li";
  const strip = s => s.replace(/^#+ /, "").replace(/^- /, "");
  let inner;
  if (segs) {
    inner = segs.map(([op, s], i) => {
      const v = esc(i === 0 ? strip(s) : s);
      return op === "+" ? `<ins>${v}</ins>` : op === "-" ? `<del>${v}</del>` : v;
    }).join("");
    if (!kind) { const first = segs[0] && segs[0][1]; if (/^#+ /.test(first)) kind = " h"; else if (/^- /.test(first)) kind = " li"; }
  } else inner = esc(strip(t));
  return `<p class="blk${kind}${cls ? " " + cls : ""}">${inner}</p>`;
}
const clip = (s, n = 260) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + " …" : s;

function hunkHTML(hk) {
  let h = `<div class="hunk">`;
  const headFirst = hk.before[0] && /^#+ /.test(hk.before[0]) && hk.before[0].replace(/^#+ /, "") === hk.section;
  if (hk.section && !headFirst) h += `<div class="sec">${esc(hk.section)}</div>`;
  for (const b of hk.before) h += blockHTML(clip(b), null, "ctx");
  for (const it of hk.items) {
    if (it.kind === "changed") h += blockHTML("", it.segs);
    else if (it.kind === "added") h += blockHTML("", [["+", it.segs[0][1]]], "added");
    else h += blockHTML("", [["-", it.segs[0][1]]], "removed");
  }
  for (const b of hk.after) h += blockHTML(clip(b), null, "ctx");
  return h + `</div>`;
}

function redline(c, limit = 8) {
  const shown = c.hunks.slice(0, limit).map(hunkHTML).join("");
  const rest = c.hunks.length - limit;
  return `<div class="redline">${shown}${rest > 0 ? `<button class="more" type="button" data-more="${c.id}">Show ${rest} more edit${rest > 1 ? "s" : ""}</button>` : ""}</div>`;
}

function changeCard(c, { open = false, showDoc = true } = {}) {
  const d = docBy[c.slug];
  const span = c.from.month === c.to.month ? day(c.to.timestamp)
    : `between ${day(c.from.timestamp)} and ${day(c.to.timestamp)}`;
  const n = c.hunks.length;
  const pd = (c.page_dates_after || []).filter(x => !(c.page_dates_before || []).includes(x));
  return `<article class="change" id="${c.id}">
    <p class="when"><span class="sr">Changed </span>${esc(span)}</p>
    <h3>${showDoc ? `<a href="#doc-${c.slug}">${esc(d.title)}</a>` : `<span>${monthName(c.to.month)}</span>`}
      <span class="chip ${sizeClass(c.size)}">${SIZE_LABEL[c.size]}</span>${showDoc ? `<span class="prod">${esc(d.product)}</span>` : ""}</h3>
    ${c.headline ? `<p class="headline">${esc(c.headline)}</p>` : ""}
    ${c.summary ? `<p class="summary">${esc(c.summary)}</p>` : `<p class="summary missing">No summary yet. The wording below shows exactly what changed.</p>`}
    <p class="meta"><span><span class="plus">+${c.added_words}</span> / <span class="minus">−${c.removed_words}</span> words</span>${pd.length ? `<span>Page now says it was updated ${esc(pd[0])}</span>` : ""}${c.url_changed ? `<span>Page moved to a new address</span>` : ""}</p>
    <details class="words"${open ? " open" : ""}><summary>${open ? "Wording" : "Show the wording"} (${n} edit${n > 1 ? "s" : ""})</summary>${redline(c)}</details>
    <p class="sources">Archived copies: <a href="${esc(wb(c.from.timestamp, c.from.original))}">before, ${day(c.from.timestamp)}</a> · <a href="${esc(wb(c.to.timestamp, c.to.original))}">after, ${day(c.to.timestamp)}</a></p>
  </article>`;
}

/* ---------- views ---------- */
function haystack(c) {
  const d = docBy[c.slug];
  let s = `${d.title} ${c.summary || ""} ${c.headline || ""} `;
  for (const hk of c.hunks) for (const it of hk.items) for (const [op, t] of it.segs) if (op !== "=") s += t + " ";
  return s.toLowerCase();
}
const HAY = Object.fromEntries(changes.map(c => [c.id, haystack(c)]));

function viewChanges() {
  const changed = docs.filter(d => d.changes.length).length;
  const real = changes.filter(c => !["date only", "formatting"].includes(c.size));
  const newest = changes[0];
  const first = DATA.months[0], lastM = DATA.months[DATA.months.length - 1];
  const prodSaved = store("mt-prod") || "";
  const minorSaved = store("mt-minor") !== "0";
  document.title = "Metaterms";
  $("#view").innerHTML = `
  <div class="intro">
    <h1>How Meta's terms and policies changed, ${monthName(first)} to ${monthName(lastM)}</h1>
    <p>Monthly copies of ${docs.length} Meta terms and policy pages from the Wayback Machine, compared word by word. Each coloured square is a month when the wording changed.</p>
    <ul class="facts">
      <li><b>${docs.length}</b><span>pages tracked</span></li>
      <li><b>${changed}</b><span>changed at least once</span></li>
      <li><b>${real.length}</b><span>changes to the wording</span></li>
      <li><b>${newest ? day(newest.to.timestamp) : "–"}</b><span>latest change found</span></li>
    </ul>
  </div>
  <section aria-labelledby="map-h">
    <div class="sec-head"><h2 id="map-h">Month by month</h2><p>Select a document to see its history, or a square to jump to that change.</p></div>
    <div class="map-box">${mapTable(docs)}</div>
    ${LEGEND}
  </section>
  <section aria-labelledby="feed-h">
    <div class="sec-head"><h2 id="feed-h">All changes, newest first</h2></div>
    <form class="filters" role="search" onsubmit="return false">
      <label for="f-prod">Product
        <select id="f-prod"><option value="">All products</option>${PRODUCTS.map(p => `<option${p === prodSaved ? " selected" : ""}>${p}</option>`).join("")}</select></label>
      <label for="f-q">Find words <input id="f-q" type="search" placeholder="e.g. artificial intelligence" autocomplete="off"></label>
      <label for="f-minor"><input id="f-minor" type="checkbox"${minorSaved ? " checked" : ""}> Include minor and date-only edits</label>
    </form>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="feed" id="feed"></div>
  </section>`;
  const run = () => {
    const p = $("#f-prod").value, q = $("#f-q").value.trim().toLowerCase(), minor = $("#f-minor").checked;
    store("mt-prod", p); store("mt-minor", minor ? "1" : "0");
    const list = changes.filter(c => (!p || docBy[c.slug].product === p)
      && (minor || !["minor", "date only", "formatting"].includes(c.size))
      && (!q || HAY[c.id].includes(q)));
    $("#count").textContent = `Showing ${list.length} of ${changes.length} changes`;
    $("#feed").innerHTML = list.length ? list.map(c => changeCard(c)).join("")
      : `<p class="empty">No changes match. Try another product or fewer words, or tick "Include minor and date-only edits".</p>`;
  };
  ["f-prod", "f-q", "f-minor"].forEach(id => $("#" + id).addEventListener("input", run));
  run();
}

function viewDoc(slug) {
  const d = docBy[slug];
  if (!d) return viewChanges();
  document.title = `${d.title} · Metaterms`;
  const list = d.changes.map(id => changeBy[id]).sort((a, b) => b.to.timestamp.localeCompare(a.to.timestamp));
  const months = DATA.months;
  const strip = months.map(m => { const c = d.cells[m] || { s: "none" }; return `<span class="s-${c.s}" title="${monthName(m)}"></span>`; }).join("");
  const latest = d.latest;
  const moved = Object.values(d.redirects || {}).map(r => r.target);
  $("#view").innerHTML = `
  <div class="doc-head">
    <a class="back" href="#changes">← All changes</a>
    <h1>${esc(d.title)}</h1>
    <dl>
      <dt>Product</dt><dd>${esc(d.product)}</dd>
      <dt>Address</dt><dd><a href="${esc(d.url)}">${esc(d.url)}</a></dd>
      ${moved.length ? `<dt>Now redirects to</dt><dd>${moved.map(u => `<a href="${esc(u)}">${esc(u)}</a>`).join("<br>")}</dd>` : ""}
      <dt>Months checked</dt><dd class="data">${d.checked_months} of ${months.length}</dd>
      <dt>Versions found</dt><dd class="data">${d.versions}</dd>
      ${latest && latest.page_dates.length ? `<dt>Page says</dt><dd>Last updated ${esc(latest.page_dates[0])}</dd>` : ""}
      ${latest ? `<dt>Latest copy</dt><dd><a href="${esc(wb(latest.timestamp, latest.original))}">${day(latest.timestamp)}</a></dd>` : ""}
    </dl>
    <div class="strip" aria-hidden="true">${strip}</div>
    <div class="strip-axis" aria-hidden="true"><span>${monthName(months[0])}</span><span>${monthName(months[months.length - 1])}</span></div>
  </div>
  <section aria-labelledby="dh">
    <div class="sec-head"><h2 id="dh">${list.length ? `${list.length} change${list.length > 1 ? "s" : ""}, newest first` : "No changes found"}</h2></div>
    <div class="feed">${list.length ? list.map(c => changeCard(c, { open: true, showDoc: false })).join("")
      : `<p class="empty">${d.checked_months ? `The wording was the same in every copy we checked.` : `The Wayback Machine had no usable copies of this page in the period.`}</p>`}</div>
  </section>`;
}

function viewAbout() {
  document.title = "About · Metaterms";
  $("#view").innerHTML = "";
  $("#view").append($("#about-tpl").content.cloneNode(true));
  $("#diary").innerHTML = DIARY.map(e => `<li${e.milestone ? ` class="milestone"` : ""}><span class="d">${esc(e.date)}${e.milestone ? `<span class="ms">Milestone</span>` : ""}</span><strong>${esc(e.title)}</strong><p>${esc(e.text)}</p></li>`).join("");
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let tab = "changes";
  if (h === "about") { tab = "about"; viewAbout(); window.scrollTo(0, 0); }
  else if (h.startsWith("doc-")) { viewDoc(h.slice(4)); window.scrollTo(0, 0); }
  else if (changeBy[h]) {
    if (!$("#feed")) viewChanges();
    let el = document.getElementById(h);
    if (!el) { $("#f-minor").checked = true; $("#f-prod").value = ""; $("#f-q").value = ""; $("#f-prod").dispatchEvent(new Event("input")); el = document.getElementById(h); }
    if (el) { el.querySelector("details").open = true; el.scrollIntoView({ block: "start" }); }
  } else { viewChanges(); if (h !== "changes") window.scrollTo(0, 0); }
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-more]");
  if (!b) return;
  const c = changeBy[b.dataset.more];
  b.parentElement.outerHTML = redline(c, Infinity);
});

$("#foot").innerHTML = `Built ${esc(DATA.generated)} from Wayback Machine copies. Not affiliated with Meta. <a href="#about">How this works and what it can't tell you</a>.`;
window.addEventListener("hashchange", route);
route();
</script>
